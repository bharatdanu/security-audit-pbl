{% extends 'integrity/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header">
                Upload Original File
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="fileInput" class="form-label">Choose file</label>
                        <input type="file" name="file" id="fileInput" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Upload & Generate Hash
                    </button>
                </form>
            </div>
        </div>

        {% if record %}
            <div class="card mt-4">
                <div class="card-header">
                    Stored Details
                </div>
                <div class="card-body">
                    <p><strong>File:</strong> <a href="{{ record.file.url }}" target="_blank">{{ record.file.name }}</a></p>
                    <p class="text-monospace"><strong>SHA-256 Hash:</strong> {{ record.hash_value }}</p>
                    <p><strong>Uploaded at:</strong> {{ record.uploaded_at }}</p>
                </div>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
