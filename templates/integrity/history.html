{% extends 'integrity/base.html' %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                Hash History
            </div>
            <div class="card-body">
                {% if records %}
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>File</th>
                                    <th>SHA-256 Hash</th>
                                    <th>Uploaded At</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for r in records %}
                                    <tr>
                                        <td><a href="{{ r.file.url }}" target="_blank">{{ r.file.name }}</a></td>
                                        <td class="text-monospace small">{{ r.hash_value }}</td>
                                        <td>{{ r.uploaded_at }}</td>
                                    </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                {% else %}
                    <p class="text-muted mb-0">No files uploaded yet.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
